services:
  web:
    image: ghcr.io/imperiatechit/imperiatechitweb:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [traefik-proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.imperiatechitweb.rule=Host(`imperiatechit.com`) || Host(`www.imperiatechit.com`)
      - traefik.http.routers.imperiatechitweb.entrypoints=websecure
      - traefik.http.routers.imperiatechitweb.tls.certresolver=letsencrypt
      - traefik.http.services.imperiatechitweb.loadbalancer.server.port=80

networks:
  traefik-proxy:
    external: true
